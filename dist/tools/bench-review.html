<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage 1 material review — MIDNIGHT CIRCUIT</title><style>body{margin:0;background:#0b1724;color:#cbdedb;font:15px system-ui}main{margin:auto;max-width:1200px;padding:12px}button{min-height:44px;padding:8px 18px;background:#28434e;color:#d8ede4;border:1px solid #67888b;border-radius:4px;margin:4px}button:focus{outline:2px solid #bcebd8}canvas{display:block;width:100%;height:auto;border:1px solid #35515c}p{margin:8px}</style><main><p>描画確認用fixture：科研費80円・各地点から開始。通常プレイ・入力による完走ではありません。</p><nav><button id="start">開始地点</button><button id="steps">地上の段差</button><button id="archive">サーバー記録室</button><button id="workshop">研究生の保守室</button><button id="open">補給箱の回収後</button><button id="lift">工具リフト</button><button id="bridge">延長トレー</button><button id="shuttle">充電キャリア</button><button id="wiring">終端の配線</button><button id="run">操作開始 / 停止</button><button id="narrow">狭い画面</button></nav><canvas id="view" width="1200" height="600"></canvas><p id="caption"></p></main><script type="module">
import {createGame,updateGame,VIEW} from '../engine.mjs?v=4.10.1';
import {drawWorld} from '../render.mjs?v=4.10.1';
import {tickBenchRoom} from '../bench-room.mjs?v=4.10.1';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');let scene='start',small=false,game,running=false,previous=0;const keys=new Set();let jump=false,pulse=false;
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyX'].includes(e.code)){e.preventDefault();if(e.code==='Space'&&!e.repeat)jump=true;if(e.code==='KeyX'&&!e.repeat)pulse=true;keys.add(e.code);}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();running=false;});
const fixtures={start:[0,0,90,470],steps:[4740,0,5450,430],archive:[3440,1000,3930,1340],workshop:[6120,770,6460,1060],open:[6120,770,6816,1060],lift:[400,0,885,470],bridge:[1650,0,1916,470],shuttle:[7100,0,7535,470],wiring:[10200,-220,10780,30]};
function paint(){running=false;const g=game=createGame(0),[x,y,px,py]=fixtures[scene];g.research.funds=80;g.camera=x;g.cameraY=y;Object.assign(g.player,{x:px,y:py});if(scene==='open')tickBenchRoom(g);VIEW.w=small?700:1200;VIEW.h=600;canvas.width=VIEW.w;canvas.height=600;if(small){g.camera=scene==='start'?0:scene==='steps'?5200:scene==='archive'?3650:scene==='lift'?560:scene==='bridge'?1800:scene==='shuttle'?7350:scene==='wiring'?10600:6340;}drawWorld(c,g,2,[],true);document.querySelector('#caption').textContent=`${scene} · ${canvas.width} × 600 · world (${g.camera}, ${y})`;}
for(const id of Object.keys(fixtures))document.getElementById(id).onclick=()=>{scene=id;paint();};document.querySelector('#narrow').onclick=()=>{small=!small;paint();};paint();
document.querySelector('#run').onclick=()=>{running=!running;};
function frame(t){if(running){const dt=Math.min(.04,(t-previous)/1000);for(let n=0;n<Math.ceil(dt*120);n++){updateGame(game,{left:keys.has('ArrowLeft'),right:keys.has('ArrowRight'),jump,pulse},1/120);jump=false;pulse=false;game.events=[];}drawWorld(c,game,game.time,[],true);document.querySelector('#caption').textContent=`入力検証fixture · ${scene} · HP${game.player.hp} · ${game.level.benchMachines.map(m=>m.id+':'+(m.kind==='lift'?(m.on?'UP':'DOWN'):m.kind==='bridge'?Math.ceil(m.timer):m.phase)).join(' / ')} · ← → / Space / X`;}previous=t;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
