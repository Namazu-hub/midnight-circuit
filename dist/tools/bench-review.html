<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage 1 material review — MIDNIGHT CIRCUIT</title><style>body{margin:0;background:#0b1724;color:#cbdedb;font:15px system-ui}main{margin:auto;max-width:1200px;padding:12px}button{min-height:44px;padding:8px 18px;background:#28434e;color:#d8ede4;border:1px solid #67888b;border-radius:4px;margin:4px}button:focus{outline:2px solid #bcebd8}canvas{display:block;width:100%;height:auto;border:1px solid #35515c}p{margin:8px}</style><main><p>描画確認用fixture：通常プレイ・入力による完走ではありません。</p><nav><button id="start">開始地点</button><button id="steps">地上の段差</button><button id="archive">サーバー記録室</button><button id="workshop">研究生の保守室</button><button id="open">補給箱の回収後</button><button id="narrow">狭い画面</button></nav><canvas id="view" width="1200" height="600"></canvas><p id="caption"></p></main><script type="module">
import {createGame,VIEW} from '../engine.mjs?v=4.9.1';
import {drawWorld} from '../render.mjs?v=4.9.1';
import {tickBenchRoom} from '../bench-room.mjs?v=4.9.1';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');let scene='start',small=false;
const fixtures={start:[0,0,90,470],steps:[4740,0,5450,430],archive:[3440,1000,3930,1340],workshop:[6120,770,6460,1060],open:[6120,770,6816,1060]};
function paint(){const g=createGame(0),[x,y,px,py]=fixtures[scene];g.camera=x;g.cameraY=y;Object.assign(g.player,{x:px,y:py});if(scene==='open')tickBenchRoom(g);VIEW.w=small?700:1200;VIEW.h=600;canvas.width=VIEW.w;canvas.height=600;if(small){g.camera=scene==='start'?0:scene==='steps'?5200:scene==='archive'?3650:6340;}drawWorld(c,g,2,[],true);document.querySelector('#caption').textContent=`${scene} · ${canvas.width} × 600 · world (${g.camera}, ${y})`;}
for(const id of Object.keys(fixtures))document.getElementById(id).onclick=()=>{scene=id;paint();};document.querySelector('#narrow').onclick=()=>{small=!small;paint();};paint();
</script></html>
