<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage 2 biomimetic review — MIDNIGHT CIRCUIT</title><style>body{margin:0;background:#0b1724;color:#cbdedb;font:15px system-ui}main{margin:auto;max-width:1200px;padding:12px}button{min-height:44px;padding:8px 18px;background:#28434e;color:#d8ede4;border:1px solid #67888b;border-radius:4px;margin:4px}button:focus{outline:2px solid #bcebd8}canvas{display:block;width:100%;height:auto;border:1px solid #35515c}p{margin:8px}</style><main><p>描画確認用fixture：科研費150円・各地点から開始。関節橋・把持試験は校正済み。通常プレイ・入力による完走ではありません。</p><nav><button id="start">開始地点</button><button id="steps">乗り継ぎ</button><button id="archive">拮抗ワイヤー室</button><button id="workshop">掌機構室</button><button id="open">精密ピンチ室</button><button id="lift">上のワイヤー</button><button id="bridge">関節橋</button><button id="shuttle">把持試験</button><button id="drum">関節校正</button><button id="thrower">投骨</button><button id="last">最後の吊り線</button><button id="boss">骨格試験機</button><button id="wiring">出口</button><button id="run">操作開始 / 停止</button><button id="narrow">狭い画面</button></nav><canvas id="view" width="1200" height="600"></canvas><p id="caption"></p></main><script type="module">
import {createGame,updateGame,VIEW} from '../engine.mjs?v=4.17.0';
import {drawWorld} from '../render.mjs?v=4.17.0';

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');let scene='start',small=false,game,running=false,previous=0;const keys=new Set();let jump=false,pulse=false,interact=false;
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyX','KeyC'].includes(e.code)){e.preventDefault();if(e.code==='Space'&&!e.repeat)jump=true;if(e.code==='KeyX'&&!e.repeat)pulse=true;if(e.code==='KeyC'&&!e.repeat)interact=true;keys.add(e.code);}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();running=false;});
const fixtures={start:[0,0,90,470],steps:[2200,-90,2466,470],archive:[11900,-1580,12100,-1360],workshop:[14000,365,14220,760],open:[16300,-1210,16550,-970],lift:[6000,-930,6186,-640],bridge:[3970,-905,4326,-640],shuttle:[7830,0,8116,470],drum:[11900,-1580,12506,-1360],thrower:[230,0,570,470],last:[10000,0,10586,364],boss:[10000,0,10310,360],wiring:[10100,0,11158,470]};
function paint(){running=false;const g=game=createGame(1),[x,y,px,py]=fixtures[scene];g.rooms.active=g.level.rooms.find(r=>px>=r.left&&px<r.right).id;g.research.funds=150;g.camera=x;g.cameraY=y;Object.assign(g.player,{x:px,y:py});if(scene==='boss'||scene==='last'){for(const r of g.level.relays)Object.assign(r,{on:true,rewardPaid:true,bonusPaid:true});for(const rig of g.level.handRigs)rig.paid=true;g.level.handRigs[0].locked=true;g.level.handRigs[1].delivered=true;Object.assign(g.level.skeleton,{active:true,phase:scene==='last'?2:0,time:2.2});}if(scene==='bridge'||scene==='shuttle'){const r=g.level.relays[scene==='bridge'?0:1];r.on=true;r.repairRank=2;r.repairResult='完全修理';r.rewardPaid=true;r.bonusPaid=true;}VIEW.w=small?700:1200;VIEW.h=600;canvas.width=VIEW.w;canvas.height=600;if(small)g.camera=Math.max(0,px-230);drawWorld(c,g,2,[],reduced);document.querySelector('#caption').textContent=`${scene} · ${canvas.width} × 600 · world (${g.camera}, ${y})`;}
for(const id of Object.keys(fixtures))document.getElementById(id).onclick=()=>{scene=id;paint();};document.querySelector('#narrow').onclick=()=>{small=!small;paint();};paint();
document.querySelector('#run').onclick=()=>{running=!running;};
function frame(t){if(running){const dt=Math.min(.04,(t-previous)/1000);for(let n=0;n<Math.ceil(dt*120);n++){updateGame(game,{left:keys.has('ArrowLeft'),right:keys.has('ArrowRight'),jump,pulse,interact},1/120);jump=false;pulse=false;interact=false;game.events=[];}drawWorld(c,game,game.time,[],reduced);document.querySelector('#caption').textContent=`入力検証fixture · ${scene} · HP${game.player.hp} · ${game.level.relays.map(r=>r.id+':'+r.on).join(' / ')} · ← → / Space / X / C 装置`;}previous=t;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
