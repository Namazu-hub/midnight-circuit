<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stage 2 biomimetic review — MIDNIGHT CIRCUIT</title><style>body{margin:0;background:#0b1724;color:#cbdedb;font:15px system-ui}main{margin:auto;max-width:1200px;padding:12px}button{min-height:44px;padding:8px 18px;background:#28434e;color:#d8ede4;border:1px solid #67888b;border-radius:4px;margin:4px}button:focus{outline:2px solid #bcebd8}canvas{display:block;width:100%;height:auto;border:1px solid #35515c}p{margin:8px}</style><main><p>描画確認用fixture：科研費80円・各地点から開始。通常プレイ・入力による完走ではありません。</p><nav><button id="start">開始地点</button><button id="steps">地上の段差</button><button id="archive">拮抗ワイヤー室</button><button id="workshop">掌機構室</button><button id="open">精密ピンチ室</button><button id="lift">巻取り塔</button><button id="bridge">関節橋</button><button id="shuttle">把持試験</button><button id="wiring">出口</button><button id="run">操作開始 / 停止</button><button id="narrow">狭い画面</button></nav><canvas id="view" width="1200" height="600"></canvas><p id="caption"></p></main><script type="module">
import {createGame,updateGame,VIEW} from '../engine.mjs?v=4.11.0';
import {drawWorld} from '../render.mjs?v=4.11.0';
import {tickBenchRoom} from '../bench-room.mjs?v=4.11.0';
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');let scene='start',small=false,game,running=false,previous=0;const keys=new Set();let jump=false,pulse=false;
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','KeyX'].includes(e.code)){e.preventDefault();if(e.code==='Space'&&!e.repeat)jump=true;if(e.code==='KeyX'&&!e.repeat)pulse=true;keys.add(e.code);}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>{keys.clear();running=false;});
const fixtures={start:[0,0,90,470],steps:[2200,-700,2410,-600],archive:[3500,-1420,4750,-1360],workshop:[3700,350,4800,760],open:[7600,-1100,8500,-970],lift:[2600,-700,3100,-600],bridge:[3950,-900,4190,-640],shuttle:[7300,0,7900,470],wiring:[8700,0,9200,470]};
function paint(){running=false;const g=game=createGame(1),[x,y,px,py]=fixtures[scene];g.research.funds=80;g.camera=x;g.cameraY=y;Object.assign(g.player,{x:px,y:py});if(scene==='open')tickBenchRoom(g);VIEW.w=small?700:1200;VIEW.h=600;canvas.width=VIEW.w;canvas.height=600;if(small){g.camera=scene==='start'?0:scene==='steps'?5200:scene==='archive'?3650:scene==='lift'?560:scene==='bridge'?1800:scene==='shuttle'?7350:scene==='wiring'?10600:6340;}drawWorld(c,g,2,[],true);document.querySelector('#caption').textContent=`${scene} · ${canvas.width} × 600 · world (${g.camera}, ${y})`;}
for(const id of Object.keys(fixtures))document.getElementById(id).onclick=()=>{scene=id;paint();};document.querySelector('#narrow').onclick=()=>{small=!small;paint();};paint();
document.querySelector('#run').onclick=()=>{running=!running;};
function frame(t){if(running){const dt=Math.min(.04,(t-previous)/1000);for(let n=0;n<Math.ceil(dt*120);n++){updateGame(game,{left:keys.has('ArrowLeft'),right:keys.has('ArrowRight'),jump,pulse},1/120);jump=false;pulse=false;game.events=[];}drawWorld(c,game,game.time,[],true);document.querySelector('#caption').textContent=`入力検証fixture · ${scene} · HP${game.player.hp} · ${game.level.relays.map(r=>r.id+':'+r.on).join(' / ')} · ← → / Space / X`;}previous=t;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
