<!doctype html><meta charset="utf-8"><title>比較測定</title><style>body{background:#142132;color:white}button{padding:15px}canvas{width:840px}output{white-space:pre-wrap}</style><button id="before">変更前を測定</button><button id="after">変更後を測定</button><output id="out">各120フレーム準備＋600フレーム処理時間測定（CPU＋描画命令。画面提示間隔ではない）。Stage4 記録入力、1200×600、音なし、演出通常。</output><p>変更前の測定には基準コミットのdist/*.mjsを tools/perf-base/ へコピーしてください。実機FPSの測定ではありません。</p><canvas width="1200" height="600"></canvas><script type="module">
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d'),out=document.querySelector('output'),rle=await(await fetch('./printer-replay.json')).json(),inputs=rle.flatMap(([n,i])=>Array(n).fill(i));
async function run(base){const {createGame,updateGame}=await import(base+'engine.mjs?v=4.7a'),{drawWorld}=await import(base+'render.mjs?v=4.7a');let effects=[];const g=createGame(3),cost=[],intervals=[];let n=0,last=0;out.textContent='測定中';function frame(t){const start=performance.now();for(let i=0;i<2;i++){updateGame(g,inputs[(n*2+i)%inputs.length]);for(const e of g.events){if(['stomp','hurt','chip','doublejump','pulse','boost'].includes(e.type)||base==='../'&&['land','runStart'].includes(e.type)){for(let j=0;j<10;j++)effects.push({x:e.x,y:e.y,vx:Math.sin(j*3)*100,vy:-60,size:3,color:'#abedda',life:.5,max:.5});}}g.events=[];}for(const p of effects){p.x+=p.vx/60;p.y+=p.vy/60;p.life-=1/60;}effects=effects.filter(p=>p.life>0).slice(-192);drawWorld(c,g,g.time,effects,false);if(n>=120){cost.push(performance.now()-start);intervals.push(t-last);}last=t;n++;if(n===720){const q=a=>{a.sort((x,y)=>x-y);return {median:a[Math.floor(a.length*.5)],p95:a[Math.floor(a.length*.95)]}};out.textContent=JSON.stringify({base,samples:600,workMs:q(cost),userAgent:navigator.userAgent},null,2);}}for(let i=0;i<720;i++)frame(performance.now());}
document.querySelector('#before').onclick=()=>run('./perf-base/');document.querySelector('#after').onclick=()=>run('../');
</script>
