<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v4.7 入力経路の描画検証</title><style>body{background:#101b2b;color:#def;font:16px system-ui;margin:20px}canvas{width:min(100%,1200px);image-rendering:pixelated}button{padding:12px;margin:6px}</style><h1>v4.7 自動入力リプレイ</h1><p>実際のゲームエンジンに記録した入力を送ります。人間による通しプレイではありません。セーブは使いません。</p><button id="start">最初から再生</button><button id="pause">停止／再開</button><button id="speed">速度 ×1</button><button id="next">次の部屋まで</button><button id="core">コア露出まで</button><button id="defeat">停止演出まで</button><button id="dawn">後日談まで</button><button id="chase">チェイス中まで</button><button id="maze">造形迷路まで</button><button id="defense">最終防衛まで</button><button id="goal">ゴールまで</button><output id="state">準備完了</output><canvas id="view" width="1200" height="600"></canvas><script type="module">
import {createGame,updateGame} from '../engine.mjs?v=4.7a';import {drawWorld} from '../render.mjs?v=4.7a';
const rle=await (await fetch('./printer-replay.json')).json(),inputs=rle.flatMap(([n,x])=>Array(n).fill(x)),c=document.querySelector('canvas').getContext('2d'),out=document.querySelector('#state');let g=createGame(3),frame=0,playing=false,speed=1,last=0,acc=0;
function step(){if(frame<inputs.length){updateGame(g,inputs[frame++]);g.events=[];}if(frame>=inputs.length)playing=false;}
document.querySelector('#start').onclick=()=>{g=createGame(3);frame=0;playing=true;};document.querySelector('#pause').onclick=()=>playing=!playing;document.querySelector('#speed').onclick=e=>{speed=speed===1?4:1;e.target.textContent='速度 ×'+speed;};document.querySelector('#next').onclick=()=>{playing=false;const room=g.rooms.active;do{step();}while(frame<inputs.length&&(g.rooms.active===room||g.rooms.transition));};
for(const [id,condition] of [['chase',()=>g.printer.chase.active&&g.printer.chase.age>5],['maze',()=>g.rooms.active==='C2'&&g.printer.journey.sites['maze-bridge'].progress>.5],['defense',()=>g.printer.boss.defense?.age>8],['goal',()=>g.finished],['core',()=>g.printer.boss.cooled],['defeat',()=>g.printer.boss.done],['dawn',()=>g.rooms.active==='H'&&g.player.x>19420]])document.querySelector('#'+id).onclick=()=>{playing=false;while(frame<inputs.length&&!condition())step();};
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(playing){acc+=dt*speed;while(acc>=1/120){step();acc-=1/120;}}drawWorld(c,g,g.time,[],true);out.textContent=`${g.rooms.active} · ${Math.round(g.time)}秒 · HP ${g.player.hp} · 残機 ${g.lives} · ${g.printer.boss.active?'PHASE '+g.printer.boss.phase:''} ${g.finished?'CLEAR':''}`;requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
