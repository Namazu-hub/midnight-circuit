<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCB 工程の描画検証</title><style>body{background:#102131;color:#daecdc;font:16px system-ui}button{padding:12px}canvas{width:min(100%,1200px);image-rendering:pixelated}output{white-space:pre-line;display:block;min-height:80px}</style><h1>PCB FACTORY — 記録入力の検証</h1><p>実エンジンへ記録入力を送信。人間の初見プレイではなく、セーブは使用しません。</p><button id="start">最初から</button><button id="next">次の工程まで</button><button id="boss">ボスまで</button><button id="final">最終フェーズまで</button><button id="goal">通常ゴールまで</button><output></output><canvas width="1200" height="600"></canvas><script type="module">
import {createGame,updateGame} from '../engine.mjs?v=4.9b';import {drawWorld} from '../render.mjs?v=4.9b';import {pcbGoal} from '../pcb-factory.mjs?v=4.9b';
const r=await(await fetch('./pcb-replay.json')).json(),inputs=r.flatMap(([n,i])=>Array(n).fill(i)),c=document.querySelector('canvas').getContext('2d'),out=document.querySelector('output');let g=createGame(5),f=0;const draw=()=>{drawWorld(c,g,g.time,[],true);out.textContent=pcbGoal(g)+'\nHP '+g.player.hp+' / 残機 '+g.lives+' / '+g.rooms.active+(g.finished?' CLEAR':'');};const step=()=>{if(f<inputs.length){updateGame(g,inputs[f++]);g.events=[];}};
document.querySelector('#start').onclick=()=>{g=createGame(5);f=0;draw();};document.querySelector('#next').onclick=()=>{const room=g.rooms.active;do{step();}while(f<inputs.length&&(g.rooms.active===room||g.rooms.transition));draw();};for(const [id,condition] of [['boss',()=>g.pcb.boss.age>2],['final',()=>g.pcb.boss.phase===4],['goal',()=>g.finished]])document.querySelector('#'+id).onclick=()=>{while(f<inputs.length&&!condition())step();draw();};draw();
</script>
