<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回路試験塔・検証</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d202c;color:#d6eadd;font:14px system-ui}header{padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}button{min-height:44px;min-width:48px;background:#203d4c;color:#d6eadd;border:1px solid #83aaac;border-radius:6px;font:inherit}canvas{display:block;width:100%;height:calc(100dvh - 180px);object-fit:contain;image-rendering:pixelated;background:#102631}output{display:block;min-height:44px;padding:4px 12px}nav{display:flex;justify-content:space-between;gap:6px;padding:8px;touch-action:none;user-select:none}nav button{flex:1}button.pressed{background:#558378}small{margin-left:8px}@media(max-height:450px){header{padding:3px}header button{min-height:44px}header small{display:none}canvas{height:calc(100dvh - 154px)}nav{padding:4px}}</style>
<header><strong>RC / DRIVE</strong><button id="entry">入口</button><button id="color">帯の試験</button><button id="diode">整流回路</button><button id="clamped">RC固定後</button><button id="ride">上層</button><button id="drive">駆動後</button><button id="island">連続コイル</button><button id="yard">複合回路</button><button id="exit">突破</button><button id="live">手動プレイ</button><small>通常開始からの記録入力。状態注入なし／セーブ不使用</small></header>
<canvas width="1200" height="600" tabindex="0" aria-label="回路試験塔のゲーム画面"></canvas><output></output><nav><button data-control="left">←</button><button data-control="right">→</button><button data-control="interact">ACTION</button><button data-control="pulse">PULSE</button><button data-control="jump">JUMP</button></nav>
<script type="module">
import {createGame,updateGame,VIEW} from '../engine.mjs?v=4.9.1';import {drawWorld} from '../render.mjs?v=4.9.1';import {towerGoal,towerControl} from '../circuit-tower.mjs?v=4.9.1';import {bindTouchControls} from '../touch-input.mjs?v=4.9.1';
const record=await(await fetch('./circuit-replay.json')).json(),inputs=record.runs.flatMap(([n,i])=>Array(n).fill(i)),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),out=document.querySelector('output');let g=createGame(5),f=0,live=false,prev=performance.now(),acc=0;const held=new Set(),edge=new Set();
function change(key,down){if(down){if(!held.has(key))edge.add(key);held.add(key);}else{held.delete(key);if(key==='jump')edge.add('jumpRelease');}}
function draw(){drawWorld(ctx,g,g.time,[],true);out.textContent=(towerGoal(g)||'搬送ライン')+' · HP '+g.player.hp+' · '+(towerControl(g)?.label||'')+(g.circuit.complete?' ✓':'')+' · R '+[1,10,100][g.circuit.band]+'kΩ · '+g.circuit.source.toUpperCase()+' '+g.circuit.diodes.map((v,i)=>'D'+(i+1)+(v?'→':'←')).join(' ')+' · DRIVE '+Math.round(g.circuit.arm*100)+'%';}
function step(i={}){updateGame(g,i);g.events=[];}
for(const id of ['entry','color','diode','clamped','ride','drive','island','yard','exit'])document.getElementById(id).onclick=()=>{live=false;document.getElementById('live').textContent='手動プレイ';held.clear();edge.clear();g=createGame(5);f=0;while(f<record.marks[id])step(inputs[f++]);draw();};
document.getElementById('live').onclick=()=>{live=!live;held.clear();edge.clear();document.getElementById('live').textContent=live?'一時停止':'手動プレイ';canvas.focus();};
const keys={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',KeyZ:'jump',ArrowUp:'jump',KeyW:'jump',KeyC:'interact',KeyF:'interact',KeyX:'pulse',ShiftLeft:'pulse'};
for(const type of ['keydown','keyup'])document.addEventListener(type,e=>{if(!keys[e.code])return;e.preventDefault();change(keys[e.code],type==='keydown');});
bindTouchControls({buttons:[...document.querySelectorAll('[data-control]')],root:document.querySelector('nav'),doc:document,win:window,isPlaying:()=>live,onChange:change});
window.addEventListener('blur',()=>{live=false;held.clear();edge.clear();});
function frame(now){acc+=Math.min(.05,(now-prev)/1000);prev=now;while(acc>=1/120){if(live){step({left:held.has('left'),right:held.has('right'),jump:edge.has('jump'),jumpRelease:edge.has('jumpRelease'),interact:edge.has('interact'),pulse:edge.has('pulse')});edge.clear();}acc-=1/120;}draw();requestAnimationFrame(frame);}draw();requestAnimationFrame(frame);
</script></html>
