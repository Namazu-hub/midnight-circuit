<!doctype html><html lang="ja"><meta charset="utf-8"><title>DRAGON-01 描画検証</title><style>body{background:#101b2b;color:#ddd;font:16px sans-serif;margin:20px}canvas{width:min(100%,1200px);image-rendering:pixelated;background:#132536}button{padding:12px;margin:8px}</style><h1>DRAGON-01 描画検証</h1><p>開発用の固定シーンです。ゲーム進行やセーブには影響しません。</p><button id="intro">積層登場</button><button id="fight">戦闘</button><button id="frame">拘束</button><canvas id="view" width="1200" height="600"></canvas><script type="module">
import {createGame} from '../engine.mjs?v=4.4a';import {drawWorld} from '../render.mjs?v=4.4a';
const g=createGame(3),c=document.querySelector('canvas').getContext('2d'),b=g.printer.boss;g.camera=5400;g.player.x=5610;g.player.y=140;b.active=true;b.age=10;b.phase=2;g.level.relays.forEach(r=>r.on=true);
document.querySelector('#intro').onclick=()=>{b.age=0;b.frame=0;b.phase=1;};document.querySelector('#fight').onclick=()=>{b.age=10;b.frame=0;b.phase=2;};document.querySelector('#frame').onclick=()=>{b.age=10;b.frame=.8;b.phase=3;};
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;g.time+=dt;b.age+=dt;drawWorld(c,g,g.time,[],true);requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
